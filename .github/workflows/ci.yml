# CI: chạy mỗi khi đẩy code hoặc mở Pull Request
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Nội dung dùng chung (test + đồng bộ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test nội dung 3 ngôn ngữ
        run: node --test shared/*.test.mjs
      - name: Kiểm tra web/mobile đã đồng bộ với shared
        run: |
          node scripts/sync-shared.mjs
          test -z "$(git status --porcelain)" || (echo "Chạy 'npm run sync' rồi commit lại"; git status --short; exit 1)

  server:
    name: API thanh toán (Node.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cài và kiểm thử toàn bộ Backend
        run: |
          npm ci --prefix server
          npm test --prefix server

  web:
    name: Web (React.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: ESLint (kiểm tra chất lượng code)
        run: npm run lint
      - name: Test (API + giao diện)
        run: npm test
      - name: Build
        run: npm run build

  mobile:
    name: Mobile (React Native / Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: ESLint (kiểm tra chất lượng code)
        run: npm run lint
      - name: Test giao diện (Jest + Testing Library)
        run: npm test
      - name: Đóng gói JavaScript cho Android (kiểm tra import, cú pháp)
        run: npx expo export --platform android --output-dir dist

  sql-integration:
    name: SQL Server và toàn bộ Admin
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: IntegrationOnly!2026
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix server
      - name: Kiểm thử SQL trên database tạm riêng biệt
        env:
          DB_INTEGRATION: 'true'
          DB_HOST: 127.0.0.1
          DB_PORT: '1433'
          DB_USER: sa
          DB_PASSWORD: IntegrationOnly!2026
        run: node --test server/test/sql.integration.test.mjs
