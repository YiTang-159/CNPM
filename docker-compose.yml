# Chạy CSDL SQL Server và API thanh toán:  docker compose up -d --build
# Dừng:  docker compose down      Xóa luôn dữ liệu:  docker compose down -v
name: dubchef

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dubchef-db
    environment:
      ACCEPT_EULA: "Y"
      # Giữ nguyên mật khẩu của SQL volume hiện tại; KHÔNG tự đổi/đặt lại SA.
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Chay npm run setup:local de tao .env va DB_PASSWORD}
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:1433:1433"
    volumes:
      - dubchef-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      # TCP readiness; API itself verifies SQL queries via /api/health.
      test: ["CMD", "/bin/bash", "-c", "echo > /dev/tcp/127.0.0.1/1433"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 45s

  # Run migrations under a separate principal BEFORE starting the production API.
  # In local Docker, SA can be used temporarily for this service; use a distinct
  # DB_MIGRATION_USER / DB_MIGRATION_PASSWORD in real production.
  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: '1433'
      DB_NAME: DubchefDB
      DB_MIGRATION_USER: ${DB_MIGRATION_USER:-sa}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      DB_TRUST_SERVER_CERTIFICATE: '${DB_TRUST_SERVER_CERTIFICATE:-true}'
      DB_CREATE_IF_MISSING: 'true'
      SEED_INITIAL_PRICING: 'true'  # idempotent initial CONFIG values, not demo customer data
    command: ['node','scripts/run-migrations.mjs']
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: dubchef-api
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: "3000"
      # Mặc định KHÔNG mô phỏng thu tiền. Chỉ dùng demo khi chủ động bật.
      PAYMENT_MODE: ${PAYMENT_MODE:-disabled}
      LOCAL_DOCKER_INSTALL: "true"  # chỉ cho phép mật khẩu SQL cũ khi cổng DB/API bind loopback
      DB_BIND_ADDRESS: ${DB_BIND_ADDRESS:-127.0.0.1}
      API_BIND_ADDRESS: ${API_BIND_ADDRESS:-127.0.0.1}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:-}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:-}
      DB_HOST: db
      DB_PORT: "1433"
      DB_USER: sa
      DB_APP_USER: ${DB_APP_USER:-}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-}
      DB_MIGRATE_ON_START: 'false'
      DB_SKIP_CREATE: 'true'
      DB_PASSWORD: ${DB_PASSWORD:?Thieu DB_PASSWORD trong .env}
      DB_NAME: DubchefDB
      DB_TRUST_SERVER_CERTIFICATE: "${DB_TRUST_SERVER_CERTIFICATE:-true}" # self-signed only in local Docker
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}"
      # Tài khoản quản trị chỉ được tạo khi ADMIN_PASSWORD (>= 12 ký tự) được đặt trong .env (chạy: npm run setup:local).
      # Production yêu cầu TOKEN_SECRET mạnh và cố định; không sinh khóa tạm thời.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@dubchef.vn}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TOKEN_SECRET: ${TOKEN_SECRET:-}
    volumes:
      - dubchef-uploads:/app/server/uploads
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 90s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: dubchef-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:5173:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Ollama chạy trên máy người dùng và chỉ truy cập qua Docker network.
  # Model được tải một lần vào volume riêng, không ảnh hưởng SQL/Uploads.
  ollama:
    image: ollama/ollama:latest
    container_name: dubchef-ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - dubchef-ollama:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 30s

  ollama-init:
    image: ollama/ollama:latest
    container_name: dubchef-ollama-init
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: 'ollama pull "$$OLLAMA_MODEL"'
    restart: "no"

volumes:
  dubchef-data:
  dubchef-uploads:
  dubchef-ollama:

