# CI: chạy mỗi khi đẩy code hoặc mở Pull Request
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: Nội dung dùng chung (test + đồng bộ)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test nội dung 3 ngôn ngữ
        run: node --test shared/i18n.test.mjs
      - name: Kiểm tra web/mobile đã đồng bộ với shared
        run: |
          node scripts/sync-shared.mjs
          test -z "$(git status --porcelain)" || (echo "Chạy 'npm run sync' rồi commit lại"; git status --short; exit 1)

  web:
    name: Web (React.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: ESLint (kiểm tra chất lượng code)
        run: npm run lint
      - name: Test (API + giao diện)
        run: npm test
      - name: Build
        run: npm run build

  mobile:
    name: Mobile (React Native / Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: ESLint (kiểm tra chất lượng code)
        run: npm run lint
      - name: Test giao diện (Jest + Testing Library)
        run: npm test
      - name: Đóng gói JavaScript cho Android (kiểm tra import, cú pháp)
        run: npx expo export --platform android --output-dir dist
