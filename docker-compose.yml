# Chạy CSDL SQL Server và API thanh toán:  docker compose up -d --build
# Dừng:  docker compose down      Xóa luôn dữ liệu:  docker compose down -v
name: dubchef

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dubchef-db
    environment:
      ACCEPT_EULA: "Y"
      # BẮT BUỘC đặt DB_PASSWORD mạnh trong .env; không còn mật khẩu mặc định.
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Chay npm run setup:local de tao .env va DB_PASSWORD}
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:1433:1433"
    volumes:
      - dubchef-data:/var/opt/mssql
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: dubchef-api
    depends_on:
      - db
    environment:
      PORT: "3000"
      # Mặc định KHÔNG mô phỏng thu tiền. Chỉ dùng demo khi chủ động bật.
      PAYMENT_MODE: ${PAYMENT_MODE:-disabled}
      PAYMENT_DEMO: ${PAYMENT_DEMO:-false}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:-}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:-}
      DB_HOST: db
      DB_PORT: "1433"
      DB_USER: sa
      DB_PASSWORD: ${DB_PASSWORD:?Thieu DB_PASSWORD trong .env}
      DB_NAME: DubchefDB
      DB_TRUST_SERVER_CERTIFICATE: "${DB_TRUST_SERVER_CERTIFICATE:-true}" # self-signed only in local Docker
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}"
      # Tài khoản quản trị chỉ được tạo khi ADMIN_PASSWORD (>= 12 ký tự) được đặt trong .env (chạy: npm run setup:local).
      # Production yêu cầu TOKEN_SECRET mạnh và cố định; không sinh khóa tạm thời.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@dubchef.vn}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TOKEN_SECRET: ${TOKEN_SECRET:-}
    volumes:
      - dubchef-uploads:/app/server/uploads
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    restart: on-failure

volumes:
  dubchef-data:
  dubchef-uploads:

