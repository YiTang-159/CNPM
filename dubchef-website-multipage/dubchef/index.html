<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dubchef</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home" data-title="pt_home">

<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="index.html" aria-label="Dubchef"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Dubchef</a>
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav" data-i18n-aria="menu"><span></span></button>
    <nav class="nav" id="nav" data-i18n-aria="navlabel">
      <a href="features.html" data-nav="features" data-i18n="nav_features"></a>
      <a href="demo.html" data-nav="demo" data-i18n="nav_demo"></a>
      <a href="pricing.html" data-nav="pricing" data-i18n="nav_pricing"></a>
      <a href="about.html" data-nav="about" data-i18n="nav_about"></a>
      <a href="contact.html" data-nav="contact" data-i18n="nav_contact"></a>
      <div class="nav-end">
        <div class="lang" role="group" data-i18n-aria="langlabel">
          <button type="button" data-lang="vi" lang="vi">VI</button>
          <button type="button" data-lang="en" lang="en">EN</button>
          <button type="button" data-lang="zh" lang="zh">中文</button>
        </div>
        <a class="btn btn-sm" href="login.html" data-i18n="nav_login"></a>
        <a class="btn btn-sm btn-primary" href="register.html" data-i18n="nav_register"></a>
      </div>
    </nav>
  </div>
</header>

<main id="main" tabindex="-1">
<div class="hero">
    <div class="wrap hero-grid">
      <div>
        <h1 data-i18n="h_title"></h1>
        <p class="lead" data-i18n="h_sub"></p>
        <div class="cta-row">
          <a class="btn btn-primary" href="demo.html" data-i18n="h_cta1"></a>
          <a class="btn" href="features.html" data-i18n="h_cta2"></a>
        </div>
      </div>
      <div class="tracks" id="heroTracks">
        <div class="tracks-head"><span id="hRec"></span><span id="hStep"></span></div>
        <div class="track vi"><span class="tag">VI</span><p class="cap" lang="vi"></p><div class="wave" data-seed="0" aria-hidden="true"></div></div>
        <div class="track en"><span class="tag">EN</span><p class="cap" lang="en"></p><div class="wave" data-seed="1" aria-hidden="true"></div></div>
        <div class="track zh"><span class="tag">中文</span><p class="cap" lang="zh"></p><div class="wave" data-seed="2" aria-hidden="true"></div></div>
        <div class="dots" id="hDots"></div>
      </div>
    </div>
  </div>

  <div class="section alt">
    <div class="wrap">
      <h2 class="sec" data-i18n="how_title"></h2>
      <ol class="steps">
        <li><div class="n">1</div><h3 data-i18n="s1t"></h3><p data-i18n="s1d"></p></li>
        <li><div class="n">2</div><h3 data-i18n="s2t"></h3><p data-i18n="s2d"></p></li>
        <li><div class="n">3</div><h3 data-i18n="s3t"></h3><p data-i18n="s3d"></p></li>
        <li><div class="n">4</div><h3 data-i18n="s4t"></h3><p data-i18n="s4d"></p></li>
      </ol>
    </div>
  </div>

  <div class="section">
    <div class="wrap">
      <h2 class="sec" data-i18n="langs_title"></h2>
      <div class="bands">
        <div class="band vi"><div class="name" lang="vi">Tiếng Việt</div><p data-i18n="l_vi_d"></p></div>
        <div class="band en"><div class="name" lang="en">English</div><p data-i18n="l_en_d"></p></div>
        <div class="band zh"><div class="name" lang="zh">中文</div><p data-i18n="l_zh_d"></p></div>
      </div>
    </div>
  </div>

  <div class="section alt cta-band">
    <div class="wrap">
      <h2 data-i18n="cta_title"></h2>
      <p data-i18n="cta_sub"></p>
      <a class="btn btn-primary" href="register.html" data-i18n="cta_btn"></a>
    </div>
  </div>
</main>

  <div class="wrap">
    <div class="foot">

          <li><a href="features.html" data-i18n="nav_features"></a></li>
          <li><a href="demo.html" data-i18n="nav_demo"></a></li>
          <li><a href="pricing.html" data-i18n="nav_pricing"></a></li>
        </ul>
      </div>
      <div>
        <h2 data-i18n="ft_company"></h2>
        <ul>
          <li><a href="about.html" data-i18n="nav_about"></a></li>
          <li><a href="faq.html" data-i18n="nav_faq"></a></li>
          <li><a href="contact.html" data-i18n="nav_contact"></a></li>
        </ul>
      </div>
      <div>
        <h2 data-i18n="ft_legal"></h2>
        <ul>
          <li><a href="terms.html" data-i18n="tm_title"></a></li>
          <li><a href="privacy.html" data-i18n="pv_title"></a></li>
        </ul>
      </div>
    </div>
    <div class="copy"><span data-i18n="ft_copy"></span><span>hello@dubchef.example</span></div>
  </div>
</footer>

<script src="js/i18n.js"></script>
<script src="js/home.js"></script>
