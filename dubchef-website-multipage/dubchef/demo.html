<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dubchef</title>
<meta name="description" content="Dubchef: lồng tiếng tự động cho video nấu ăn bằng tiếng Việt, tiếng Anh và tiếng Trung.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="demo" data-title="d_title">
<a class="skip" href="#main" data-i18n="skip">Bỏ qua đến nội dung</a>

<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="index.html" aria-label="Dubchef"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Dubchef</a>
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav" data-i18n-aria="menu"><span></span></button>
    <nav class="nav" id="nav" data-i18n-aria="navlabel">
      <a href="features.html" data-nav="features" data-i18n="nav_features"></a>
      <a href="demo.html" data-nav="demo" data-i18n="nav_demo"></a>
      <a href="pricing.html" data-nav="pricing" data-i18n="nav_pricing"></a>
      <a href="about.html" data-nav="about" data-i18n="nav_about"></a>
      <a href="contact.html" data-nav="contact" data-i18n="nav_contact"></a>
      <div class="nav-end">
        <div class="lang" role="group" data-i18n-aria="langlabel">
          <button type="button" data-lang="vi" lang="vi">VI</button>
          <button type="button" data-lang="en" lang="en">EN</button>
          <button type="button" data-lang="zh" lang="zh">中文</button>
        </div>
        <a class="btn btn-sm" href="login.html" data-i18n="nav_login"></a>
        <a class="btn btn-sm btn-primary" href="register.html" data-i18n="nav_register"></a>
      </div>
    </nav>
  </div>
</header>

<main id="main" tabindex="-1">
<div class="wrap page-head">
    <h1 data-i18n="d_title"></h1>
    <p data-i18n="d_sub"></p>
  </div>
  <div class="wrap">
    <div class="up">
      <label class="drop" id="dz">
        <input type="file" id="file" accept="video/*">
        <strong data-i18n="d_drop"></strong>
        <small id="fname"></small>
      </label>
      <div>
        <div class="field">
          <label for="url" data-i18n="d_url"></label>
          <input id="url" type="url" inputmode="url" placeholder="https://">
        </div>
        <button class="btn btn-primary" type="button" id="startBtn" data-i18n="d_start"></button>
        <p class="err" id="dErr" role="alert" hidden style="margin-top:12px" data-msg="d_need"></p>
      </div>
    </div>
    <ol class="pipe" id="pipe" hidden>
      <li data-s="wait"><span data-i18n="s2t"></span><span class="st"></span><div class="bar-t"><b></b></div></li>
      <li data-s="wait"><span data-i18n="s3t"></span><span class="st"></span><div class="bar-t"><b></b></div></li>
      <li data-s="wait"><span data-i18n="p3"></span><span class="st"></span><div class="bar-t"><b></b></div></li>
      <li data-s="wait"><span data-i18n="s4t"></span><span class="st"></span><div class="bar-t"><b></b></div></li>
    </ol>
    <p class="ok" id="pipeDone" role="status" hidden style="margin-top:16px" data-i18n="d_done"></p>

    <div class="player" id="player">
      <div>
        <div class="stage">
          <div id="scene" aria-hidden="true"></div>
          <div class="subs" id="subs" aria-live="polite"></div>
        </div>
        <div class="controls">
          <div class="seg-progress" id="segs"></div>
          <div class="ctl-row">
            <button class="btn btn-primary" type="button" id="playBtn"></button>
            <div class="ctl-group"><span data-i18n="d_voice"></span>
              <div class="chips" id="voiceChips" role="group" data-i18n-aria="d_voice">
                <button class="chip" type="button" data-v="vi" lang="vi">Tiếng Việt</button>
                <button class="chip" type="button" data-v="en" lang="en">English</button>
                <button class="chip" type="button" data-v="zh" lang="zh">中文</button>
                <button class="chip" type="button" data-v="off" data-i18n="d_off"></button>
              </div>
            </div>
          </div>
          <div class="ctl-row">
            <div class="ctl-group"><span data-i18n="d_subs"></span>
              <div class="chips" id="subChips" role="group" data-i18n-aria="d_subs">
                <button class="chip" type="button" data-s="vi">VI</button>
                <button class="chip" type="button" data-s="en">EN</button>
                <button class="chip" type="button" data-s="zh">中文</button>
              </div>
            </div>
            <div class="ctl-group"><label for="speed" data-i18n="d_speed" style="font-size:.9rem;font-weight:600"></label>
              <select id="speed"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select>
            </div>
          </div>
          <p class="note" id="noVoice" hidden data-i18n="d_nospeech"></p>
        </div>
      </div>
      <div>
        <h3><span data-i18n="d_sample"></span><span id="dRec"></span></h3>
        <ol class="cue-list" id="cueList" aria-label="" data-i18n-aria="d_steps"></ol>
      </div>
    </div>
    <div style="height:84px"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="foot">
      <div>
        <a class="brand" href="index.html" aria-label="Dubchef"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Dubchef</a>
        <p data-i18n="ft_tag"></p>
      </div>
      <div>
        <h2 data-i18n="ft_product"></h2>
        <ul>
          <li><a href="features.html" data-i18n="nav_features"></a></li>
          <li><a href="demo.html" data-i18n="nav_demo"></a></li>
          <li><a href="pricing.html" data-i18n="nav_pricing"></a></li>
        </ul>
      </div>
      <div>
        <h2 data-i18n="ft_company"></h2>
        <ul>
          <li><a href="about.html" data-i18n="nav_about"></a></li>
          <li><a href="faq.html" data-i18n="nav_faq"></a></li>
          <li><a href="contact.html" data-i18n="nav_contact"></a></li>
        </ul>
      </div>
      <div>
        <h2 data-i18n="ft_legal"></h2>
        <ul>
          <li><a href="terms.html" data-i18n="tm_title"></a></li>
          <li><a href="privacy.html" data-i18n="pv_title"></a></li>
        </ul>
      </div>
    </div>
    <div class="copy"><span data-i18n="ft_copy"></span><span>hello@dubchef.example</span></div>
  </div>
</footer>

<script src="js/i18n.js"></script>
<script src="js/demo.js"></script>
<script src="js/common.js"></script>
</body>
</html>
