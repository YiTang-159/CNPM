<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dubchef</title>
<meta name="description" content="Dubchef: lồng tiếng tự động cho video nấu ăn bằng tiếng Việt, tiếng Anh và tiếng Trung.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register" data-title="rg_title">
<a class="skip" href="#main" data-i18n="skip">Bỏ qua đến nội dung</a>

<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="index.html" aria-label="Dubchef"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Dubchef</a>
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav" data-i18n-aria="menu"><span></span></button>
    <nav class="nav" id="nav" data-i18n-aria="navlabel">
      <a href="features.html" data-nav="features" data-i18n="nav_features"></a>
      <a href="demo.html" data-nav="demo" data-i18n="nav_demo"></a>
      <a href="pricing.html" data-nav="pricing" data-i18n="nav_pricing"></a>
      <a href="about.html" data-nav="about" data-i18n="nav_about"></a>
      <a href="contact.html" data-nav="contact" data-i18n="nav_contact"></a>
      <div class="nav-end">
        <div class="lang" role="group" data-i18n-aria="langlabel">
          <button type="button" data-lang="vi" lang="vi">VI</button>
          <button type="button" data-lang="en" lang="en">EN</button>
          <button type="button" data-lang="zh" lang="zh">中文</button>
        </div>
        <a class="btn btn-sm" href="login.html" data-i18n="nav_login"></a>
        <a class="btn btn-sm btn-primary" href="register.html" data-i18n="nav_register"></a>
      </div>
    </nav>
  </div>
</header>

<main id="main" tabindex="-1">
<div class="wrap auth">
    <h1 data-i18n="rg_title"></h1>
    <p class="sub" data-i18n="rg_sub"></p>
    <form id="regForm" novalidate>
      <p class="ok" id="regForm-ok" role="status" hidden></p>
      <div class="field"><label for="r-name" data-i18n="f_name"></label><input id="r-name" name="name" autocomplete="name"><p class="err" id="regForm-name-e" role="alert" hidden></p></div>
      <div class="field"><label for="r-email" data-i18n="f_email"></label><input id="r-email" name="email" type="email" autocomplete="email"><p class="err" id="regForm-email-e" role="alert" hidden></p></div>
      <div class="field"><label for="r-pass" data-i18n="f_pass"></label><input id="r-pass" name="pass" type="password" autocomplete="new-password"><p class="err" id="regForm-pass-e" role="alert" hidden></p></div>
      <div class="field"><label for="r-pass2" data-i18n="f_pass2"></label><input id="r-pass2" name="pass2" type="password" autocomplete="new-password"><p class="err" id="regForm-pass2-e" role="alert" hidden></p></div>
      <div class="field">
        <div class="check"><input id="r-agree" name="agree" type="checkbox"><label for="r-agree"><span data-i18n="f_agree"></span> <a href="terms.html" data-i18n="tm_title"></a></label></div>
        <p class="err" id="regForm-agree-e" role="alert" hidden></p>
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%" data-i18n="rg_btn"></button>
    </form>
    <p class="alt"><span data-i18n="rg_have"></span> <a href="login.html" data-i18n="nav_login"></a></p>
  </div>
</main>

<footer>
  <div class="wrap">
    <div class="foot">
      <div>
        <a class="brand" href="index.html" aria-label="Dubchef"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Dubchef</a>
        <p data-i18n="ft_tag"></p>
      </div>
      <div>
        <h2 data-i18n="ft_product"></h2>
        <ul>
          <li><a href="features.html" data-i18n="nav_features"></a></li>
          <li><a href="demo.html" data-i18n="nav_demo"></a></li>
          <li><a href="pricing.html" data-i18n="nav_pricing"></a></li>
        </ul>
      </div>
      <div>
        <h2 data-i18n="ft_company"></h2>
        <ul>
          <li><a href="about.html" data-i18n="nav_about"></a></li>
          <li><a href="faq.html" data-i18n="nav_faq"></a></li>
          <li><a href="contact.html" data-i18n="nav_contact"></a></li>
        </ul>
      </div>
      <div>
        <h2 data-i18n="ft_legal"></h2>
        <ul>
          <li><a href="terms.html" data-i18n="tm_title"></a></li>
          <li><a href="privacy.html" data-i18n="pv_title"></a></li>
        </ul>
      </div>
    </div>
    <div class="copy"><span data-i18n="ft_copy"></span><span>hello@dubchef.example</span></div>
  </div>
</footer>

<script src="js/i18n.js"></script>
<script src="js/forms.js"></script>
<script src="js/common.js"></script>
</body>
</html>
