<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dubchef</title>
<meta name="description" content="Dubchef: lồng tiếng tự động cho video nấu ăn bằng tiếng Việt, tiếng Anh và tiếng Trung.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F7F5; --panel:#FFFFFF; --ink:#12302A; --muted:#4F6660; --line:#D3DDD8;
  --accent:#12302A; --on-accent:#FFFFFF;
  --vi:#C2331F; --en:#1F4FC4; --zh:#8A5F00;
  --sc-bg:#DCE9E2; --sc-tab:#C3D6CC;
  --focus:#1F4FC4;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A17; --panel:#16241F; --ink:#E8F0EC; --muted:#9DB2AA; --line:#2A3C36;
    --accent:#CDEBDD; --on-accent:#0F1A17;
    --vi:#FF8A78; --en:#8FB0FF; --zh:#E8B94A;
    --sc-bg:#1E3129; --sc-tab:#284238; --focus:#8FB0FF;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A17; --panel:#16241F; --ink:#E8F0EC; --muted:#9DB2AA; --line:#2A3C36;
  --accent:#CDEBDD; --on-accent:#0F1A17;
  --vi:#FF8A78; --en:#8FB0FF; --zh:#E8B94A;
  --sc-bg:#1E3129; --sc-tab:#284238; --focus:#8FB0FF;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque","Be Vietnam Pro","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0}
:lang(zh) h1,:lang(zh) h2,:lang(zh) h3{line-height:1.25;letter-spacing:0}
p{margin:0}
a{color:inherit}
img,svg{max-width:100%}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{width:min(1120px,100% - 40px);margin-inline:auto}
.skip{position:absolute;left:12px;top:-60px;background:var(--accent);color:var(--on-accent);padding:10px 14px;border-radius:8px;z-index:50;text-decoration:none}
.skip:focus{top:12px}
[hidden]{display:none!important}

/* header */
.site-header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:68px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.35rem;letter-spacing:-.02em}
.mark{display:grid;gap:3px;width:24px}
.mark i{display:block;height:5px;border-radius:3px}
.mark i:nth-child(1){background:var(--vi);width:100%}
.mark i:nth-child(2){background:var(--en);width:72%}
.mark i:nth-child(3){background:var(--zh);width:88%}
.nav{display:flex;align-items:center;gap:2px}
.nav>a{padding:8px 12px;text-decoration:none;font-size:.95rem;font-weight:500;color:var(--muted);border-radius:8px}
.nav>a:hover{color:var(--ink)}
.nav>a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink);border-radius:0}
.nav-end{display:flex;align-items:center;gap:10px;margin-left:14px}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.lang button{border:0;background:transparent;color:var(--muted);font:600 .82rem/1 inherit;font-family:inherit;padding:9px 10px;cursor:pointer;min-height:36px}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.menu-btn{display:none;border:1px solid var(--line);background:var(--panel);width:44px;height:44px;border-radius:10px;cursor:pointer;position:relative}
.menu-btn span,.menu-btn span::before,.menu-btn span::after{content:"";position:absolute;left:12px;right:12px;height:2px;background:var(--ink);border-radius:2px}
.menu-btn span{top:21px}.menu-btn span::before{left:0;right:0;top:-6px}.menu-btn span::after{left:0;right:0;top:6px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:10px;border:1.5px solid var(--accent);font:600 .97rem/1 inherit;font-family:inherit;text-decoration:none;cursor:pointer;background:transparent;color:var(--ink)}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-sm{min-height:38px;padding:0 14px;font-size:.9rem}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn:hover:not(:disabled){filter:brightness(1.08)}

/* layout */
main{outline:none}
.page{padding-bottom:0}
.section{padding:84px 0}
.section.alt{background:var(--panel);border-block:1px solid var(--line)}
.page-head{padding:72px 0 36px}
.page-head h1{font-size:clamp(2.1rem,4.6vw,3.4rem);max-width:20ch}
.page-head p{margin-top:16px;color:var(--muted);max-width:60ch;font-size:1.08rem}
h2.sec{font-size:clamp(1.7rem,3.2vw,2.4rem);max-width:24ch}

/* hero */
.hero{padding:72px 0 88px}
.hero-grid{display:grid;grid-template-columns:1.02fr .98fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(2.6rem,6.2vw,4.9rem);line-height:1.02}
.hero .lead{margin-top:22px;font-size:1.13rem;color:var(--muted);max-width:52ch}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}

.tracks{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 20px 18px}
.tracks-head{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-weight:600;font-size:.95rem}
.tracks-head span:last-child{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.track{padding:16px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:44px 1fr;column-gap:12px;row-gap:10px}
.tag{font-weight:700;font-size:.82rem;color:var(--c);padding-top:3px}
.track.vi{--c:var(--vi)}.track.en{--c:var(--en)}.track.zh{--c:var(--zh)}
.cap{min-height:3.3em;font-size:1rem;line-height:1.55}
.wave{grid-column:2;display:flex;align-items:center;gap:2px;height:22px}
.wave i{flex:1;height:100%;background:var(--c);border-radius:2px;transform:scaleY(var(--h));animation:pulse 1.15s ease-in-out infinite;animation-delay:var(--d)}
@keyframes pulse{50%{transform:scaleY(calc(var(--h)*.4))}}
.dots{display:flex;gap:8px;padding-top:16px}
.dots button{flex:1;height:8px;border:0;border-radius:4px;background:var(--line);cursor:pointer;padding:0;position:relative}
.dots button::after{content:"";position:absolute;inset:-10px 0}
.dots button[aria-current="true"]{background:var(--ink)}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin-top:44px;list-style:none;padding:0}
.steps li{border-top:2px solid var(--ink);padding-top:18px}
.steps .n{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:2.6rem;line-height:1;color:var(--muted)}
.steps h3{font-size:1.2rem;margin:14px 0 8px}
.steps p{color:var(--muted);font-size:.97rem}

/* language bands */
.bands{margin-top:40px}
.band{display:grid;grid-template-columns:.7fr 1.3fr;gap:32px;align-items:baseline;padding:28px 0 28px 22px;border-top:1px solid var(--line);border-left:5px solid var(--c)}
.band:last-child{border-bottom:1px solid var(--line)}
.band.vi{--c:var(--vi)}.band.en{--c:var(--en)}.band.zh{--c:var(--zh)}
.band .name{font-family:"Bricolage Grotesque","PingFang SC","Microsoft YaHei",sans-serif;font-weight:800;font-size:clamp(1.8rem,3.4vw,2.6rem);color:var(--c);line-height:1.15}
.band p{color:var(--muted);max-width:58ch}

.cta-band{text-align:left}
.cta-band h2{font-size:clamp(1.8rem,3.6vw,2.7rem);max-width:22ch}
.cta-band p{margin:14px 0 26px;color:var(--muted);max-width:52ch}

/* feature rows */
.rows{margin-top:16px}
.row{display:grid;grid-template-columns:1fr 1.5fr;gap:32px;padding:28px 0;border-top:1px solid var(--line)}
.row:last-child{border-bottom:1px solid var(--line)}
.row h3{font-size:1.3rem}
.row p{color:var(--muted);max-width:58ch}
.exports{display:grid;gap:12px;margin:24px 0 0;padding:0;list-style:none}
.exports li{padding:14px 18px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}

/* demo */
.up{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:start}
.drop{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;text-align:center;min-height:170px;padding:24px;border:2px dashed var(--line);border-radius:16px;background:var(--panel);cursor:pointer;font-weight:500}
.drop.over,.drop:focus-within{border-color:var(--ink)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop small{color:var(--muted);font-weight:400;word-break:break-all}
.field{display:grid;gap:6px;margin-bottom:16px}
.field label{font-weight:600;font-size:.93rem}
.field input,.field textarea,.field select{font:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;min-height:46px;width:100%}
.field textarea{min-height:130px;resize:vertical}
.field [aria-invalid="true"]{border-color:var(--vi)}
.err{color:var(--vi);font-size:.9rem;font-weight:500}
.ok{padding:12px 16px;border-radius:10px;border:1.5px solid var(--en);color:var(--ink);background:color-mix(in srgb,var(--en) 10%,transparent);margin-bottom:16px}
.pipe{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:10px}
.pipe li{display:grid;grid-template-columns:1fr auto;gap:6px 16px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.pipe .st{font-size:.88rem;color:var(--muted)}
.pipe li[data-s="done"] .st{color:var(--en);font-weight:600}
.bar-t{grid-column:1/-1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar-t b{display:block;height:100%;width:0;background:var(--ink)}
.pipe li[data-s="run"] .bar-t b{width:100%;transition:width 1.05s linear}
.pipe li[data-s="done"] .bar-t b{width:100%}

.player{display:grid;grid-template-columns:1.6fr 1fr;gap:28px;margin-top:20px}
.stage{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:var(--sc-bg);border:1px solid var(--line)}
.stage>svg{position:absolute;inset:0;width:100%;height:100%}
.subs{position:absolute;left:0;right:0;bottom:0;padding:10px 14px 12px;background:rgba(10,28,24,.88);color:#fff;display:grid;gap:4px;font-size:.95rem;line-height:1.4}
.subs p{display:flex;gap:10px}
.subs b{flex:none;font-size:.75rem;padding-top:2px;min-width:26px}
.subs .vi b{color:#FF9C8C}.subs .en b{color:#9DB6FF}.subs .zh b{color:#F2CB6B}
.controls{margin-top:16px;display:grid;gap:16px}
.seg-progress{display:flex;gap:6px}
.seg-progress button{flex:1;height:8px;border:0;padding:0;border-radius:4px;background:var(--line);cursor:pointer;position:relative}
.seg-progress button::after{content:"";position:absolute;inset:-10px 0}
.seg-progress button[aria-current="true"]{background:var(--ink)}
.ctl-row{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center}
.ctl-group{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctl-group>span{font-size:.9rem;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font:500 .9rem/1 inherit;font-family:inherit;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--accent);color:var(--on-accent)}
.ctl-group select{font:inherit;min-height:38px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:0 10px}
.note{font-size:.9rem;color:var(--muted);padding:10px 14px;border-left:3px solid var(--zh);background:color-mix(in srgb,var(--zh) 10%,transparent);border-radius:0 8px 8px 0}
.cue-list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.cue-list button{width:100%;text-align:left;font:inherit;font-size:.93rem;line-height:1.5;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.cue-list button[aria-current="true"]{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--ink)}
.player h3{font-size:1.1rem}

/* pricing */
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);margin-top:24px}
.toggle button{border:0;background:transparent;color:var(--muted);font:600 .92rem/1 inherit;font-family:inherit;padding:12px 18px;cursor:pointer;min-height:44px}
.toggle button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:36px;align-items:stretch}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:18px}
.plan.pick{border:2px solid var(--ink)}
.plan h3{font-size:1.35rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font:600 .78rem/1 inherit;font-family:inherit;padding:6px 10px;border-radius:999px;background:var(--accent);color:var(--on-accent)}
.price{font-family:"Bricolage Grotesque","PingFang SC","Microsoft YaHei",sans-serif;font-weight:800;font-size:2.3rem;letter-spacing:-.02em;line-height:1}
.price small{font:500 .95rem/1 "Be Vietnam Pro",sans-serif;color:var(--muted);letter-spacing:0}
.plan ul{list-style:none;padding:0;margin:0;display:grid;gap:10px;flex:1}
.plan li{padding-left:22px;position:relative}
.plan li::before{content:"";position:absolute;left:2px;top:.55em;width:10px;height:6px;border-left:2.5px solid var(--en);border-bottom:2.5px solid var(--en);transform:rotate(-45deg)}
.fine{margin-top:28px;color:var(--muted);font-size:.95rem}

/* about / prose */
.prose{max-width:66ch;display:grid;gap:18px;font-size:1.05rem}
.values{margin:44px 0 0}
.values .row{grid-template-columns:.8fr 1.4fr}

/* faq */
.faq{max-width:820px;margin-top:8px}
details{border-top:1px solid var(--line)}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding:22px 44px 22px 0;font-weight:600;font-size:1.06rem;position:relative}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:6px;top:50%;translate:0 -50%;font-size:1.6rem;font-weight:400;color:var(--muted);line-height:1}
details[open] summary::after{content:"\2212"}
details p{padding:0 44px 24px 0;color:var(--muted);max-width:64ch}

/* contact / auth */
.two{display:grid;grid-template-columns:1.3fr .7fr;gap:56px}
.side{border-left:1px solid var(--line);padding-left:32px;display:grid;gap:14px;align-content:start}
.side h2{font-size:1.2rem}
.side p{color:var(--muted)}
.auth{max-width:440px;margin:0 auto;padding:64px 0 96px}
.auth h1{font-size:2.2rem}
.auth .sub{margin:10px 0 28px;color:var(--muted)}
.auth .alt{margin-top:22px;color:var(--muted)}
.auth .alt a{color:var(--ink);font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.check input{width:20px;height:20px;margin-top:3px;flex:none}
.legal{max-width:720px;padding:72px 0 96px}
.legal h1{font-size:clamp(2rem,4vw,3rem)}
.legal .upd{color:var(--muted);margin:12px 0 36px}
.legal h2{font-size:1.25rem;margin:30px 0 8px}
.legal p{color:var(--muted)}
.nf{padding:120px 0}
.nf h1{font-size:clamp(2.2rem,5vw,3.6rem)}
.nf p{margin:14px 0 28px;color:var(--muted)}

/* footer */
footer{border-top:1px solid var(--line);background:var(--panel);padding:56px 0 32px}
.foot{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:32px}
.foot p{color:var(--muted);max-width:34ch;margin-top:12px;font-size:.95rem}
.foot h2{font-family:"Be Vietnam Pro",sans-serif;font-size:.95rem;font-weight:600;letter-spacing:0;margin-bottom:12px}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.foot a{color:var(--muted);text-decoration:none;font-size:.95rem}
.foot a:hover{color:var(--ink);text-decoration:underline}
.copy{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

@media (max-width:960px){
  .menu-btn{display:block}
  .nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;padding:12px 20px 20px;gap:4px}
  .nav.open{display:flex}
  .nav>a{padding:14px 8px}
  .nav>a[aria-current="page"]{box-shadow:none;font-weight:700}
  .nav-end{margin:10px 0 0;flex-wrap:wrap}
  .hero-grid,.up,.player,.two{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr 1fr}
  .plans{grid-template-columns:1fr}
  .side{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:28px}
  .foot{grid-template-columns:1fr 1fr}
}
@media (max-width:620px){
  .section{padding:60px 0}
  .row,.values .row,.band{grid-template-columns:1fr;gap:10px}
  .steps{grid-template-columns:1fr}
  .foot{grid-template-columns:1fr}
  .hero{padding-top:44px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .wave i{animation:none}
  .pipe li[data-s="run"] .bar-t b{transition:none}
}
</style>
</head>
<body>
<a class="skip" href="#main" id="skip" data-i18n="skip">Bỏ qua đến nội dung</a>

<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="#/" aria-label="Dubchef"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Dubchef</a>
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav" data-i18n-aria="menu"><span></span></button>
    <nav class="nav" id="nav" data-i18n-aria="navlabel">
      <a href="#/features" data-nav="features" data-i18n="nav_features"></a>
      <a href="#/demo" data-nav="demo" data-i18n="nav_demo"></a>
      <a href="#/pricing" data-nav="pricing" data-i18n="nav_pricing"></a>
      <a href="#/about" data-nav="about" data-i18n="nav_about"></a>
      <a href="#/contact" data-nav="contact" data-i18n="nav_contact"></a>
      <div class="nav-end">
        <div class="lang" role="group" data-i18n-aria="langlabel">
          <button type="button" data-lang="vi" lang="vi">VI</button>
          <button type="button" data-lang="en" lang="en">EN</button>
          <button type="button" data-lang="zh" lang="zh">中文</button>
        </div>
        <a class="btn btn-sm" href="#/login" data-i18n="nav_login"></a>
        <a class="btn btn-sm btn-primary" href="#/register" data-i18n="nav_register"></a>
      </div>
    </nav>
  </div>
</header>

<main id="main" tabindex="-1">

<!-- HOME -->
<section class="page" data-page="home">
  <div class="hero">
    <div class="wrap hero-grid">
      <div>
        <h1 data-i18n="h_title"></h1>
        <p class="lead" data-i18n="h_sub"></p>
        <div class="cta-row">
          <a class="btn btn-primary" href="#/demo" data-i18n="h_cta1"></a>
          <a class="btn" href="#/features" data-i18n="h_cta2"></a>
        </div>
      </div>
      <div class="tracks" id="heroTracks">
        <div class="tracks-head"><span id="hRec"></span><span id="hStep"></span></div>
        <div class="track vi"><span class="tag">VI</span><p class="cap" lang="vi"></p><div class="wave" data-seed="0" aria-hidden="true"></div></div>
        <div class="track en"><span class="tag">EN</span><p class="cap" lang="en"></p><div class="wave" data-seed="1" aria-hidden="true"></div></div>
        <div class="track zh"><span class="tag">中文</span><p class="cap" lang="zh"></p><div class="wave" data-seed="2" aria-hidden="true"></div></div>
        <div class="dots" id="hDots"></div>
      </div>
    </div>
  </div>

a_title:["Giúp công thức đi xa hơn ngôn ngữ của nó","Helping recipes travel beyond their language","让食谱跨越语言的界限"],
a_p1:["Dubchef bắt đầu như một đồ án môn Công nghệ phần mềm. Nhóm nhận ra rất nhiều kênh nấu ăn hay chỉ có một ngôn ngữ, trong khi người xem muốn nấu theo bằng tiếng mẹ đẻ.","Dubchef began as a software engineering course project. We noticed that many great cooking channels exist in a single language, while viewers want to cook along in their own.","Dubchef 始于一门软件工程课程的项目。我们发现许多优秀的烹饪频道只有一种语言，而观众希望用母语跟着做。"],
a_p2:["Hệ thống nối ba công nghệ: nhận dạng giọng nói, dịch máy và tổng hợp giọng nói, rồi ghép kết quả lại theo đúng thời gian của video.","The system chains three technologies, speech recognition, machine translation and speech synthesis, then places the result back on the video's timeline.","系统串联三项技术：语音识别、机器翻译和语音合成，再按视频时间线把结果合成回去。"],
a_v_title:["Nguyên tắc của chúng tôi","Our principles","我们的原则"],
v1_t:["Chính xác trước, nhanh sau","Accuracy first, speed second","先准确，后速度"],
v1_d:["Một sai sót về định lượng có thể làm hỏng cả món ăn, nên chúng tôi ưu tiên sự đúng đắn.","A wrong quantity can ruin a dish, so we favor getting it right.","用量出错可能毁掉一道菜，所以我们优先保证准确。"],
v2_t:["Tôn trọng món ăn","Respect the dish","尊重菜肴"],
v2_d:["Tên món và kỹ thuật riêng của từng vùng được giữ lại, kèm giải thích ngắn khi cần.","Regional dish names and techniques are kept, with a short explanation when needed.","保留各地菜名和技法，必要时附上简短说明。"],
v3_t:["Nói rõ đây là bản dịch máy","Be clear it is machine-made","注明这是机器翻译"],
v3_d:["Người xem luôn biết phần lồng tiếng do máy tạo, và người làm video được sửa trước khi đăng.","Viewers can always tell the dub is machine-made, and creators can edit before publishing.","观众能清楚知道配音由机器生成，创作者也能在发布前修改。"],

fq_title:["Câu hỏi thường gặp","Frequently asked questions","常见问题"],
q1:["Dubchef hỗ trợ những ngôn ngữ nào?","Which languages does Dubchef support?","Dubchef 支持哪些语言？"],
a1:["Tiếng Việt, tiếng Anh và tiếng Trung giản thể. Bạn có thể dịch qua lại giữa cả ba.","Vietnamese, English and Simplified Chinese. You can translate in any direction between the three.","越南语、英语和简体中文，三者之间可以任意方向互译。"],
q2:["Video có cần lời thoại rõ ràng không?","Does the video need clear speech?","视频需要清晰的讲解吗？"],
a2:["Nên có. Giọng càng rõ thì kết quả càng chính xác; nhạc nền lớn hoặc tiếng ồn có thể làm giảm chất lượng.","Ideally yes. The clearer the voice, the better the result; loud music or noise can reduce quality.","最好是的。声音越清晰，结果越准确；过大的背景音乐或噪音会降低质量。"],
q3:["Tên nguyên liệu và định lượng có được dịch đúng không?","Are ingredients and quantities translated correctly?","食材和用量能翻译准确吗？"],
a3:["Hệ thống dùng từ điển nấu ăn riêng và đổi đơn vị khi cần. Dù vậy, bạn nên xem lại bản dịch trước khi đăng.","The system uses a dedicated cooking glossary and converts units when needed. Still, review the translation before publishing.","系统使用专门的烹饪词库，并在需要时换算单位。即便如此，发布前仍建议你检查译文。"],
q4:["Video của tôi có được lưu lại không?","Is my video stored?","我的视频会被保存吗？"],
a4:["Trong bản demo này, video không rời khỏi trình duyệt. Ở bản chính thức, bạn có thể xóa video bất cứ lúc nào.","In this demo the video never leaves your browser. In the full version you can delete a video at any time.","在此演示中，视频不会离开浏览器。正式版中，你可以随时删除视频。"],
q5:["Tôi có sửa được bản dịch không?","Can I edit the translation?","我可以修改译文吗？"],
a5:["Có. Bạn sửa từng câu trong trình chỉnh sửa rồi chỉ tạo lại giọng đọc cho câu đó.","Yes. Edit any line in the editor and regenerate the voice for just that line.","可以。在编辑器中修改任意一句，然后只重新生成该句的配音。"],
q6:["Tôi có dùng giọng đọc cho mục đích thương mại được không?","Can I use the voices commercially?","配音可以商用吗？"],
a6:["Được, với gói Người sáng tạo và Xưởng phim.","Yes, on the Creator and Studio plans.","可以，创作者版和工作室版均允许商用。"],

'<svg viewBox="0 0 320 180" aria-hidden="true"><rect width="320" height="180" fill="var(--sc-bg)"/><rect y="128" width="320" height="52" fill="var(--sc-tab)"/>'+SHADOW+'<path d="M92 92Q160 176 228 92Z" fill="#fff" '+STROKE+'/><ellipse cx="160" cy="92" rx="68" ry="12" fill="#FFF3C4" '+STROKE+'/><circle cx="144" cy="92" r="9" fill="#F5B301"/><circle cx="172" cy="94" r="9" fill="#F5B301"/><circle cx="242" cy="122" r="7" fill="#fff" '+STROKE+'/><circle cx="262" cy="126" r="7" fill="#fff" '+STROKE+'/><path d="M214 34L176 88" stroke="#12302A" stroke-width="4" stroke-linecap="round"/></svg>',
'<svg viewBox="0 0 320 180" aria-hidden="true"><rect width="320" height="180" fill="var(--sc-bg)"/><rect y="128" width="320" height="52" fill="var(--sc-tab)"/>'+SHADOW+PAN+'<ellipse cx="140" cy="112" rx="58" ry="11" fill="#F7CF4B"/><ellipse cx="126" cy="109" rx="20" ry="5" fill="#FBE38A"/>'+STEAM+'</svg>',
'<svg viewBox="0 0 320 180" aria-hidden="true"><rect width="320" height="180" fill="var(--sc-bg)"/><rect y="128" width="320" height="52" fill="var(--sc-tab)"/>'+SHADOW+PAN+'<ellipse cx="140" cy="112" rx="50" ry="10" fill="#F7CF4B"/><ellipse cx="108" cy="110" rx="14" ry="6" fill="#D6402F" transform="rotate(-20 108 110)"/><ellipse cx="134" cy="114" rx="14" ry="6" fill="#D6402F" transform="rotate(15 134 114)"/><ellipse cx="158" cy="108" rx="14" ry="6" fill="#D6402F" transform="rotate(-10 158 108)"/><ellipse cx="176" cy="114" rx="12" ry="5" fill="#D6402F" transform="rotate(25 176 114)"/>'+STEAM+'</svg>',
'<svg viewBox="0 0 320 180" aria-hidden="true"><rect width="320" height="180" fill="var(--sc-bg)"/><rect y="128" width="320" height="52" fill="var(--sc-tab)"/>'+SHADOW+'<ellipse cx="160" cy="118" rx="98" ry="22" fill="#fff" '+STROKE+'/><ellipse cx="160" cy="116" rx="72" ry="14" fill="#F2F2EE"/><ellipse cx="160" cy="106" rx="54" ry="15" fill="#F7CF4B"/><ellipse cx="136" cy="104" rx="14" ry="6" fill="#D6402F" transform="rotate(-20 136 104)"/><ellipse cx="164" cy="100" rx="14" ry="6" fill="#D6402F" transform="rotate(12 164 100)"/><ellipse cx="184" cy="108" rx="12" ry="5" fill="#D6402F" transform="rotate(-15 184 108)"/><path d="M152 92q10-16 26-6-8 12-26 6Z" fill="#3F8F5B"/>'+STEAM+'</svg>'
];

var L=0;
try{var sv=localStorage.getItem('dubchef-lang'); if(LANGS.indexOf(sv)>-1)L=LANGS.indexOf(sv);}catch(e){}
function t(k){var v=I[k];return v?v[L]:k;}
function $(s,r){return (r||document).querySelector(s);}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));}
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var PAGES=['home','features','demo','pricing','about','faq','contact','login','register','terms','privacy'];
var TITLE={home:'pt_home',features:'ft_title',demo:'d_title',pricing:'pr_title',about:'a_title',faq:'fq_title',contact:'c_title',login:'li_title',register:'rg_title',terms:'tm_title',privacy:'pv_title','404':'nf_title'};
var current='home';

/* ---------- hero tracks ---------- */
var hero={i:0,timer:null};
$$('#heroTracks .wave').forEach(function(w){
  var s=+w.dataset.seed,h='';
  for(var n=0;n<44;n++){var v=(0.25+0.75*Math.abs(Math.sin(n*1.7+s*2.1))).toFixed(2);h+='<i style="--h:'+v+';--d:'+((n%11)*0.09).toFixed(2)+'s"></i>';}
  w.innerHTML=h;
});
var hDots=$('#hDots');
for(var d=0;d<CUES.length;d++){(function(n){var b=document.createElement('button');b.type='button';b.addEventListener('click',function(){setHero(n,true);startHero();});hDots.appendChild(b);})(d);}
function setHero(i,anim){
  hero.i=i;
  $$('#heroTracks .track').forEach(function(tr,k){
    var cap=$('.cap',tr);cap.textContent=CUES[i][LANGS[k]];
    if(anim&&!reduce&&cap.animate)cap.animate([{opacity:0,transform:'translateY(5px)'},{opacity:1,transform:'none'}],{duration:280,easing:'ease-out'});
  });
  $('#hRec').textContent=t('rec_name');
  $('#hStep').textContent=t('step')+' '+(i+1)+'/'+CUES.length;
  $$('button',hDots).forEach(function(b,k){b.setAttribute('aria-label',t('step')+' '+(k+1));if(k===i)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current');});
}
function stopHero(){if(hero.timer){clearInterval(hero.timer);hero.timer=null;}}
function startHero(){stopHero();if(reduce||current!=='home')return;hero.timer=setInterval(function(){if(!document.hidden)setHero((hero.i+1)%CUES.length,true);},4200);}

/* ---------- pricing ---------- */
var yearly=false;
var PRICES=[[0,250000,750000],[0,10,30],[0,70,200]];
function money(n){
  return new Intl.NumberFormat(['vi-VN','en-US','zh-CN'][L],{style:'currency',currency:['VND','USD','CNY'][L],maximumFractionDigits:0}).format(n);
}
function renderPricing(){
  var h='';
  for(var p=0;p<3;p++){
    var base=PRICES[L][p],val=yearly?base*0.8:base,pick=p===1;
    h+='<div class="plan'+(pick?' pick':'')+'"><h3>'+t('pl'+(p+1))+(pick?'<span class="badge">'+t('pl_pick')+'</span>':'')+'</h3>'+
    '<div class="price">'+money(val)+' <small>'+t('pr_per')+'</small></div><ul>'+
    '<li>'+t('pl'+(p+1)+'_1')+'</li><li>'+t('pl'+(p+1)+'_2')+'</li><li>'+t('pl'+(p+1)+'_3')+'</li></ul>'+
    '<a class="btn'+(pick?' btn-primary':'')+'" href="#/register">'+(p===0?t('pl_c1'):t('pl_c'))+'</a></div>';
  }
  $('#plans').innerHTML=h;
  $('#billM').setAttribute('aria-pressed',String(!yearly));
  $('#billY').setAttribute('aria-pressed',String(yearly));
}
$('#billM').addEventListener('click',function(){yearly=false;renderPricing();});
$('#billY').addEventListener('click',function(){yearly=true;renderPricing();});

/* ---------- demo player ---------- */
var demo={i:0,playing:false,finished:false,voice:LANGS[L],subs:{},speed:1,token:0,file:''};
demo.subs[LANGS[L]]=true;
var LANGCODE={vi:'vi-VN',en:'en-US',zh:'zh-CN'};
var hasSpeech='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
function voiceFor(lang){
  if(!hasSpeech)return null;
  var vs=speechSynthesis.getVoices();
  for(var k=0;k<vs.length;k++){if(vs[k].lang.toLowerCase().replace('_','-').indexOf(lang)===0)return vs[k];}
  return null;
}
function voiceKnownMissing(lang){return !hasSpeech||(speechSynthesis.getVoices().length>0&&!voiceFor(lang));}

var segs=$('#segs'),cueList=$('#cueList');
CUES.forEach(function(c,n){
  var b=document.createElement('button');b.type='button';b.addEventListener('click',function(){jump(n);});segs.appendChild(b);
  var li=document.createElement('li'),bb=document.createElement('button');bb.type='button';bb.addEventListener('click',function(){jump(n);});li.appendChild(bb);cueList.appendChild(li);
});

function renderDemo(){
  $('#scene').innerHTML=SCENES[demo.i];
  var sh='';
  ['vi','en','zh'].forEach(function(l){if(demo.subs[l])sh+='<p class="'+l+'" lang="'+(l==='zh'?'zh-CN':l)+'"><b>'+(l==='zh'?'中文':l.toUpperCase())+'</b><span>'+CUES[demo.i][l]+'</span></p>';});
  $('#subs').innerHTML=sh;$('#subs').hidden=!sh;
  $$('button',segs).forEach(function(b,k){b.setAttribute('aria-label',t('step')+' '+(k+1));if(k===demo.i)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current');});
  $$('button',cueList).forEach(function(b,k){b.textContent=CUES[k][LANGS[L]];if(k===demo.i)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current');});
  $('#playBtn').textContent=demo.playing?t('d_pause'):(demo.finished?t('d_replay'):t('d_play'));
  $$('#voiceChips .chip').forEach(function(c){c.setAttribute('aria-pressed',String(c.dataset.v===demo.voice));});
  $$('#subChips .chip').forEach(function(c){c.setAttribute('aria-pressed',String(!!demo.subs[c.dataset.s]));});
  $('#dRec').textContent=t('rec_name');
  $('#noVoice').hidden=demo.voice==='off'||!voiceKnownMissing(demo.voice);
}
function stopSpeech(){if(hasSpeech){try{speechSynthesis.cancel();}catch(e){}}}
function playCue(i){
  var my=++demo.token;demo.i=i;demo.playing=true;demo.finished=false;renderDemo();
  var voiceOn=demo.voice!=='off'&&hasSpeech&&!!voiceFor(demo.voice);
  var speechDone=!voiceOn,timeDone=false;
  function next(){
    if(my!==demo.token||!demo.playing)return;
    if(speechDone&&timeDone){if(i+1<CUES.length)playCue(i+1);else{demo.playing=false;demo.finished=true;renderDemo();}}
  }
  setTimeout(function(){timeDone=true;next();},3600/demo.speed);
  if(voiceOn){
    stopSpeech();
    var u=new SpeechSynthesisUtterance(CUES[i][demo.voice]);
    u.lang=LANGCODE[demo.voice];u.rate=demo.speed;u.voice=voiceFor(demo.voice);
    u.onend=function(){speechDone=true;next();};
    u.onerror=function(){speechDone=true;next();};
    try{speechSynthesis.speak(u);}catch(e){speechDone=true;}
    setTimeout(function(){speechDone=true;next();},16000);
  }
}
function pauseDemo(){demo.token++;demo.playing=false;stopSpeech();renderDemo();}
function jump(n){var was=demo.playing;demo.token++;stopSpeech();demo.i=n;demo.finished=false;if(was)playCue(n);else{demo.playing=false;renderDemo();}}
$('#playBtn').addEventListener('click',function(){
  if(demo.playing)pauseDemo();
  else playCue(demo.finished?0:demo.i);
});
$('#voiceChips').addEventListener('click',function(e){
  var b=e.target.closest('.chip');if(!b)return;
  demo.voice=b.dataset.v;
  if(demo.playing)playCue(demo.i);else renderDemo();
});
$('#subChips').addEventListener('click',function(e){
  var b=e.target.closest('.chip');if(!b)return;
  var l=b.dataset.s;if(demo.subs[l])delete demo.subs[l];else demo.subs[l]=true;
  renderDemo();
});
$('#speed').addEventListener('change',function(e){demo.speed=parseFloat(e.target.value);if(demo.playing)playCue(demo.i);});
if(hasSpeech){try{speechSynthesis.onvoiceschanged=function(){renderDemo();};}catch(e){}}

/* upload + pipeline */
var dz=$('#dz'),fileInp=$('#file'),urlInp=$('#url'),pipe=$('#pipe');
['dragenter','dragover'].forEach(function(n){dz.addEventListener(n,function(e){e.preventDefault();dz.classList.add('over');});});
['dragleave','drop'].forEach(function(n){dz.addEventListener(n,function(e){e.preventDefault();dz.classList.remove('over');});});
dz.addEventListener('drop',function(e){var f=e.dataTransfer&&e.dataTransfer.files[0];if(f)setFile(f.name);});
fileInp.addEventListener('change',function(){if(fileInp.files[0])setFile(fileInp.files[0].name);});
function setFile(name){demo.file=name;$('#fname').textContent=t('d_chosen')+name;$('#dErr').hidden=true;}
function pipeStatus(){$$('li',pipe).forEach(function(li){$('.st',li).textContent=t('st_'+li.dataset.s);});}
var running=false;
$('#startBtn').addEventListener('click',function(){
  if(running)return;
  if(!demo.file&&!urlInp.value.trim()){$('#dErr').textContent=t('d_need');$('#dErr').hidden=false;return;}
  $('#dErr').hidden=true;$('#pipeDone').hidden=true;running=true;this.disabled=true;
  var rows=$$('li',pipe),k=0,btn=this;pipe.hidden=false;
  rows.forEach(function(r){r.dataset.s='wait';});pipeStatus();
  function step(){
    if(k>=rows.length){
      running=false;btn.disabled=false;$('#pipeDone').hidden=false;
      $('#player').scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});return;
    }
    var r=rows[k];r.dataset.s='run';pipeStatus();
    setTimeout(function(){r.dataset.s='done';pipeStatus();k++;step();},reduce?300:1150);
  }
  step();
});

/* ---------- forms ---------- */
var EMAIL=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
function bindForm(id,rules,okKey){
  var f=$('#'+id);
  f.addEventListener('submit',function(ev){
    ev.preventDefault();
    var ok=true,first=null;
    rules.forEach(function(r){
      var el=f.elements[r.name],err=$('#'+id+'-'+r.name+'-e'),bad=!r.test(el,f);
      err.hidden=!bad;err.dataset.msg=r.msg;
      if(bad){err.textContent=t(r.msg);el.setAttribute('aria-invalid','true');ok=false;first=first||el;}
      else el.removeAttribute('aria-invalid');
    });
    var st=$('#'+id+'-ok');
    if(ok){st.hidden=false;st.dataset.msg=okKey;st.textContent=t(okKey);f.reset();}
    else{st.hidden=true;first.focus();}
  });
}
var nonEmpty=function(el){return el.value.trim().length>0;};
var mail=function(el){return EMAIL.test(el.value.trim());};
var pw=function(el){return el.value.length>=8;};
bindForm('contactForm',[{name:'name',test:nonEmpty,msg:'e_name'},{name:'email',test:mail,msg:'e_email'},{name:'msg',test:nonEmpty,msg:'e_msg'}],'c_ok');
bindForm('loginForm',[{name:'email',test:mail,msg:'e_email'},{name:'pass',test:pw,msg:'e_pass'}],'li_ok');
bindForm('regForm',[
  {name:'name',test:nonEmpty,msg:'e_name'},{name:'email',test:mail,msg:'e_email'},{name:'pass',test:pw,msg:'e_pass'},
  {name:'pass2',test:function(el,f){return el.value===f.elements.pass.value&&el.value.length>0;},msg:'e_pass2'},
  {name:'agree',test:function(el){return el.checked;},msg:'e_agree'}
],'rg_ok');

/* ---------- i18n ---------- */
function applyI18n(){
  document.documentElement.lang=['vi','en','zh-CN'][L];
  $$('[data-i18n]').forEach(function(e){e.textContent=t(e.dataset.i18n);});
  $$('[data-i18n-ph]').forEach(function(e){e.placeholder=t(e.dataset.i18nPh);});
  $$('[data-i18n-aria]').forEach(function(e){e.setAttribute('aria-label',t(e.dataset.i18nAria));});
  $$('.lang button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.lang===LANGS[L]));});
  $$('.err:not([hidden]),.ok:not([hidden])').forEach(function(e){if(e.dataset.msg)e.textContent=t(e.dataset.msg);});
  if(demo.file)$('#fname').textContent=t('d_chosen')+demo.file;
  pipeStatus();renderPricing();setHero(hero.i);renderDemo();updateTitle();
}
function updateTitle(){document.title=t(TITLE[current])+' | Dubchef';}
$$('.lang button').forEach(function(b){b.addEventListener('click',function(){
  L=LANGS.indexOf(b.dataset.lang);
  try{localStorage.setItem('dubchef-lang',LANGS[L]);}catch(e){}
  if(!demo.playing){demo.voice=demo.voice;}
  applyI18n();
});});

/* ---------- router ---------- */
function route(first){
  var h=(location.hash||'').replace(/^#\/?/,'').split('?')[0];
  if(!h)h='home';
  var p=PAGES.indexOf(h)>-1?h:'404';
  if(current==='demo'&&p!=='demo')pauseDemo();
  current=p;
  $$('.page').forEach(function(s){s.hidden=s.dataset.page!==p;});
  $$('.nav a[data-nav]').forEach(function(a){if(a.dataset.nav===p)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  $('#nav').classList.remove('open');$('#menuBtn').setAttribute('aria-expanded','false');
  updateTitle();
  if(p==='home')startHero();else stopHero();
  if(!first){window.scrollTo(0,0);$('#main').focus({preventScroll:true});}
}
window.addEventListener('hashchange',function(){route(false);});
$('#menuBtn').addEventListener('click',function(){
  var open=$('#nav').classList.toggle('open');this.setAttribute('aria-expanded',String(open));
});
$('#skip').addEventListener('click',function(e){e.preventDefault();$('#main').focus();});

applyI18n();
route(true);
})();
</script>
</body>
</html>
